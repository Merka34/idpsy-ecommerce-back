services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      # Este volumen hace que las fotos se guarden en tu PC real 
      # pero el contenedor las vea en /app/uploads
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000